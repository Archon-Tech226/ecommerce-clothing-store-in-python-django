<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin Login — Maison Elara</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;1,300&family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--charcoal:#1C1C1A;--gold:#B8976A;--ivory:#FAF7F2;--cream:#F8F4EF;--border:rgba(28,28,26,.12);--serif:'Cormorant Garamond',Georgia,serif;--sans:'Montserrat',sans-serif}
body{background:var(--charcoal);font-family:var(--sans);display:flex;align-items:center;justify-content:center;min-height:100vh}
.card{background:var(--ivory);padding:3rem;width:380px}
.logo{font-family:var(--serif);font-size:24px;font-weight:300;letter-spacing:.15em;text-align:center;margin-bottom:.5rem}
.logo em{font-style:italic;color:var(--gold)}
.subtitle{font-size:10px;letter-spacing:.25em;text-transform:uppercase;color:#999;text-align:center;margin-bottom:2.5rem}
.form-label{display:block;font-size:10px;letter-spacing:.15em;text-transform:uppercase;color:#888;margin-bottom:6px;font-weight:500}
.form-control{width:100%;padding:11px 14px;border:.5px solid var(--border);background:var(--cream);font-family:var(--sans);font-size:13px;color:var(--charcoal);outline:none;transition:border-color .2s}
.form-control:focus{border-color:var(--gold)}
.btn{display:block;width:100%;padding:13px;background:var(--charcoal);color:var(--ivory);border:none;font-family:var(--sans);font-size:10px;letter-spacing:.2em;text-transform:uppercase;font-weight:500;cursor:pointer;margin-top:1.5rem;transition:background .2s}
.btn:hover{background:var(--gold)}
.error{background:#fdf0ef;color:#7a1a1a;border-left:3px solid #c0392b;padding:10px 14px;font-size:12px;margin-bottom:1.25rem}
.hint{font-size:11px;color:#aaa;text-align:center;margin-top:1.25rem}
.hint strong{color:var(--gold)}
a{color:var(--gold);font-size:11px;display:block;text-align:center;margin-top:1rem}
</style>
</head>
<body>
<div class="card">
  <div class="logo">Maison <em>Elara</em></div>
  <div class="subtitle">Admin Panel</div>
  {% if error %}<div class="error">{{ error }}</div>{% endif %}
  <form method="post">
    {% csrf_token %}
    <div style="margin-bottom:1.25rem">
      <label class="form-label">Password</label>
      <input type="password" name="password" class="form-control" autofocus placeholder="Enter admin password">
    </div>
    <button type="submit" class="btn">Enter Dashboard</button>
  </form>
  <div class="hint">Default password: <strong>elara2026</strong></div>
  <a href="/">← Back to Store</a>
</div>
</body>
</html>
